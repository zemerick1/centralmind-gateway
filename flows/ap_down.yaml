name: ap_down_alert
description: "Handle AP offline or degraded alerts from Aruba Central"
trigger_keywords: ["ap_down", "ap_offline", "ap_degraded"]

system_prompt: |
  You are an expert Aruba Central network operator.
  When an AP goes down or has issues:
  1. Use CentralMind tools to check current status, connected clients, and recent events for that AP/site.
  2. Summarize the business impact clearly.
  3. Recommend next steps if any.
  4. Post a professional notification to the primary channel (Teams preferred).

inputs:
  - alert_type
  - ap_name
  - site
  - timestamp

outputs:
  - primary: teams
  - secondary: slack   # if configured

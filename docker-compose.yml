version: "3.9"

services:
  gateway:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount your central-mind if you want to run it from source inside the container
      # - ../central-mind:/central-mind:ro
    restart: unless-stopped
    # If running central-mind inside the same container, add:
    # command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

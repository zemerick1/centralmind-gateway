[project]
name = "centralmind-gateway"
version = "0.2.0"
description = "Minimal LLM-powered webhook event gateway using CentralMind MCP"
readme = "README.md"
requires-python = ">=3.12"

# Core runtime dependencies
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "litellm>=1.52.0",
    "mcp>=1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.uv]
# Include the dev group by default when running `uv sync`
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
